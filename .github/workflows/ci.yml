# kanku checks itself: the runner's, report's and gates' unit tests,
# including the report against a real run's recorded row.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests
        run: PYTHONPATH=scripts:tests uv run --no-project --python '>=3.11' --with pyyaml python3 -m unittest discover -s tests
      - name: Wrapper parses
        run: bash -n scripts/kanku
